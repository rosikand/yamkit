# yamkit settings (non-rig). Cloud storage for datasets and models — see README "Cloud storage".
# Credentials never go here: the huggingface backend uses HF_TOKEN or `hf auth login`.
storage:
  backend: huggingface
  namespace: null # HF user/org to push into; null = your logged-in HF username
  private: true # newly created cloud repos are private

  # Where artifacts (datasets, rollout recordings, trained models) are kept:
  #   local  -> local folders only (default; push/pull manually via `yamkit dataset|model`)
  #   both   -> local folders + auto-pushed to the cloud after each successful run
  #   cloud  -> cloud only (staged locally, removed after a verified upload)
  mode: local

  # Advanced per-kind overrides (win over `mode`):
  # datasets: {save_local: true, auto_push: false}
  # models:   {save_local: true, auto_push: false}
