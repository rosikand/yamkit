site_name: yamkit
site_description: Operate I2RT YAM arms with safe teleoperation and LeRobot workflows.
repo_name: yamkit

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Get started:
      - Installation: getting-started/installation.md
      - Configure a rig: getting-started/rig-setup.md
  - Operate:
      - Safety: operations/safety.md
      - Teleoperation: operations/teleoperation.md
      - LeRobot workflows: operations/lerobot.md
      - Troubleshooting: operations/troubleshooting.md
  - Reference:
      - Architecture: reference/architecture.md
      - Rig configuration: reference/rig-config.md
      - CLI: reference/cli.md
      - Working with the API:
          - Overview: reference/api.md
          - Core Python API: reference/api-core.md
          - LeRobot plugin API: reference/api-lerobot.md
          - Programmatic recipes: reference/api-recipes.md
  - Develop: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

strict: true
