[project]
name = "lerobot_robot_yamkit"
version = "0.1.0"
description = "LeRobot robot plugin for I2RT YAM follower arms (yam_follower, bi_yam_follower), backed by yamkit."
requires-python = ">=3.12"
# yamkit itself is provided by the workspace root (avoids a dependency cycle).
dependencies = ["lerobot>=0.6.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_yamkit"]
