[project]
name = "lerobot_teleoperator_yamkit"
version = "0.1.0"
description = "LeRobot teleoperator plugin for I2RT YAM leader arms with teaching handles (yam_leader, bi_yam_leader)."
requires-python = ">=3.12"
dependencies = ["lerobot>=0.6.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_teleoperator_yamkit"]
